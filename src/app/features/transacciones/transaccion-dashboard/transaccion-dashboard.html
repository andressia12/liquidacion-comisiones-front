<div class="tx-header">
  <h1 class="text-center">Sistema de Liquidación de Comisiones "Sofka-Fintech"</h1>
</div>

<app-transaccion-form></app-transaccion-form>

<mat-card>
  @if (transactions$ | async; as transactions) {
  <div>
    <table mat-table [dataSource]="transactions" class="mat-elevation-z8 full-width">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let tx">{{ tx.id }}</td>
      </ng-container>

      <ng-container matColumnDef="monto">
        <th mat-header-cell *matHeaderCellDef>Monto</th>
        <td mat-cell *matCellDef="let tx">
          {{ tx.monto | number : '1.2-2' }}
        </td>
      </ng-container>

      <ng-container matColumnDef="comision">
        <th mat-header-cell *matHeaderCellDef>Comisión</th>
        <td mat-cell *matCellDef="let tx">
          {{ tx.comision | number : '1.2-2' }}
        </td>
      </ng-container>

      <ng-container matColumnDef="fecha">
        <th mat-header-cell *matHeaderCellDef>Fecha</th>
        <td mat-cell *matCellDef="let tx">
          {{ tx.fecha | date : 'short' }}
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="['id', 'monto', 'comision', 'fecha']"></tr>
      <tr mat-row *matRowDef="let row; columns: ['id', 'monto', 'comision', 'fecha']"></tr>
    </table>
  </div>
  } @else {
  <div class="loading">Cargando transacciones...</div>
  }
</mat-card>
